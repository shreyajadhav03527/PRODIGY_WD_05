<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
    <div class="weather-card">

        <h1>🌤 Weather App</h1>
        <p class="subtitle">Check weather anywhere in the world</p>

        <div class="search-box">
            <input type="text" id="city" placeholder="Enter city name">
            <button id="searchBtn">Search</button>
        </div>

        <button class="location-btn" id="locationBtn">
            📍 Use My Location
        </button>

        <div id="weather" class="weather-info hidden">

            <h2 id="cityName"></h2>

            <img id="icon" src="" alt="weather icon">

            <h1 id="temp"></h1>

            <p id="condition"></p>

            <div class="details">
                <div class="box">
                    <h3>💧 Humidity</h3>
                    <p id="humidity"></p>
                </div>

                <div class="box">
                    <h3>🌬 Wind</h3>
                    <p id="wind"></p>
                </div>

                <div class="box">
                    <h3>🌡 Feels Like</h3>
                    <p id="feels"></p>
                </div>
            </div>

        </div>

        <p id="error" class="error"></p>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
